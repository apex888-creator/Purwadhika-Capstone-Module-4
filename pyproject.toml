[project]
name = "purwa-yolo"
version = "0.1.0"
description = "Electronic Road Pricing: YOLO vehicle detection + licence-plate OCR (odd-even rule)"
authors = [
    {name = "steven", email = "stevenlee13092003@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"

# Only packages the code imports directly (everything else comes in as a
# dependency of these). Loose ranges here, exact versions live in poetry.lock.
dependencies = [
    # --- app ---
    "streamlit (>=1.53.1,<2.0.0)",
    # pandas is installed by Streamlit; our code does not import it. Pinned to 2.x on
    # purpose: freshly installed pandas 3.x binaries can be blocked by Windows App Control.
    "pandas (>=2.2.0,<3.0.0)",
    "numpy (>=2.0.0,<3.0.0)",
    "pillow (>=11.0.0,<13.0.0)",
    # --- vehicle detection ---
    "ultralytics (>=8.4.80,<9.0.0)",
    "supervision (>=0.27.0,<0.28.0)",
    "torch (>=2.5.0,<3.0.0)",
    "opencv-python (>=4.10.0,<6.0.0)",
    # --- plate OCR: fast-alpr = plate detector + fast-plate-ocr; [onnx] = CPU runtime ---
    "fast-alpr[onnx] (>=0.4.0,<0.5.0)",
    # --- video output (H.264 so the browser can play it) ---
    "imageio (>=2.38.1,<3.0.0)",
    "imageio-ffmpeg (>=0.8.1,<0.9.0)",
]

[tool.poetry]
packages = [{include = "purwa_yolo", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
