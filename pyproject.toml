[project]
name = "purwa-yolo"
version = "0.1.0"
description = ""
authors = [
    {name = "steven",email = "stevenlee13092003@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "numpy (>=2.4.1,<3.0.0)",
    "streamlit (>=1.53.1,<2.0.0)",
    "supervision (>=0.27.0,<0.28.0)",
    "ultralytics (>=8.4.8,<9.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "imageio (>=2.38.1,<3.0.0)",
    "imageio-ffmpeg (>=0.8.1,<0.9.0)",
    "opencv-python-headless (>=5.0.0.93,<6.0.0.0)",
    "fast-alpr (>=1.1.0,<2.0.0)", 
    "torch (>=2.11.0)", 
    "torchvision (>=0.22.0)"
]

[tool.poetry]
packages = [{include = "purwa_yolo", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
